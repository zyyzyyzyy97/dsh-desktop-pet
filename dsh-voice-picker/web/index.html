<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音色工作台 · 小鲸鱼</title>
<style>
  :root {
    --bg: #0f1216; --panel: #161b22; --card: #1a212b; --card-hover: #202836;
    --line: #2a3240; --text: #e6ebf2; --muted: #8b96a5; --accent: #4da3ff;
    --accent-strong: #1f7ae0; --ok: #3fb96f; --warn: #e0a13f; --err: #e05d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 18px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 21px; margin: 0; letter-spacing: .5px; }
  h1 .num { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; }
  .status {
    margin-left: auto; display: flex; gap: 8px; align-items: center;
    font-size: 12.5px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); display: inline-block; margin-right: 5px; }
  .dot.on { background: var(--ok); }
  .now {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin: 12px 0 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .now b { color: var(--accent); font-size: 15px; }
  .now .muted { color: var(--muted); font-size: 12.5px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type="search"], input[type="text"] {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px; outline: none;
  }
  input[type="search"]:focus, input[type="text"]:focus { border-color: var(--accent); }
  #search { width: 220px; }
  #previewText { flex: 1; min-width: 260px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; user-select: none;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 13px; display: flex; flex-direction: column; gap: 6px;
    transition: border-color .15s, background .15s;
  }
  .card:hover { background: var(--card-hover); }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card .head { display: flex; align-items: baseline; gap: 8px; }
  .card .zh { font-size: 16.5px; font-weight: 600; }
  .card .id { color: var(--muted); font-size: 11.5px; font-family: Consolas, monospace; }
  .card .use-badge {
    margin-left: auto; color: var(--accent); font-size: 11.5px; border: 1px solid var(--accent);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .card .desc { color: var(--muted); font-size: 12.5px; min-height: 19px; }
  .card .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; color: var(--muted); background: #222b38; border-radius: 5px; padding: 1px 7px;
  }
  .tag.f { color: #f08fb4; } .tag.m { color: #6fb6f0; } .tag.dialect { color: #e0a13f; } .tag.lang { color: #9d8df0; }
  .card .btns { display: flex; gap: 8px; margin-top: 4px; }
  button {
    border: 1px solid var(--line); background: #232c39; color: var(--text);
    border-radius: 8px; padding: 6px 0; font-size: 13px; cursor: pointer; flex: 1;
    transition: background .15s;
  }
  button:hover { background: #2c3849; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  button.primary:hover { background: #2b86ea; }
  .spin {
    display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; animation: r .7s linear infinite; vertical-align: -1px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 9; }
  .toast {
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; max-width: 340px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: up .18s ease-out;
  }
  .toast.err { border-left-color: var(--err); }
  .toast.ok { border-left-color: var(--ok); }
  @keyframes up { from { transform: translateY(8px); opacity: 0; } }
  footer { margin-top: 26px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>音色工作台 · <span class="num" id="count">48</span> 音色</h1>
    <span class="sub">试听 → 一键切换 → 小鲸鱼立刻用新声音说话（热生效，不用重启）</span>
    <span class="status"><span><span class="dot" id="petDot"></span><span id="petText">检查小鲸鱼…</span></span></span>
  </header>

  <div class="now">
    <span class="muted">当前音色：</span><b id="current">—</b>
    <span class="muted" id="currentId"></span>
    <span class="muted" style="margin-left:auto">点「使用」后鲸鱼会自己说一句让你确认</span>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="搜索：名字 / 描述 / id…">
    <input type="text" id="previewText" value="你好呀，我是小鲸鱼，今天想聊点什么？" title="试听文本（最长 120 字）">
    <button style="flex:0 0 auto;padding:6px 14px" id="refreshBtn" title="重新读取当前音色">刷新状态</button>
  </div>

  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>

  <footer>
    主通道 qwen3-tts-flash（试听与说话都是它）；如果 API 挂了，小鲸鱼会退到本地 edge-tts（恒为晓晓，与本页选择无关）。
    桌面气泡与 QQ 语音共用此音色。音色数据来自
    <a href="https://help.aliyun.com/zh/model-studio/qwen-tts-voice-list" target="_blank">官方音色列表</a>（2026-10-30 交叉验证）。
  </footer>
</div>
<div id="toasts"></div>

<script>
const state = { voices: [], current: null, petOnline: false, hasKey: false, filter: '全部', q: '' };
const $ = (s) => document.querySelector(s);

function toast(msg, cls = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + cls;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

const DIALECTS = ['上海话','四川话','粤语','北京话','南京话','陕西话','闽南语','天津话'];
function tagClass(v) {
  if (DIALECTS.includes(v.lang)) return 'dialect';
  if (v.lang !== '普通话') return 'lang';
  return '';
}
function metaChips(v) {
  const out = [v.gender, DIALECTS.includes(v.lang) ? v.lang : (v.lang !== '普通话' ? v.lang : null)].filter(Boolean);
  for (const t of v.tags) if (!['方言'].includes(t)) out.push(t);
  return [...new Set(out)];
}
function matchFilter(v) {
  if (state.filter === '全部') return true;
  if (state.filter === '女声') return v.gender === '女';
  if (state.filter === '男声') return v.gender === '男';
  if (state.filter === '方言') return DIALECTS.includes(v.lang);
  if (state.filter === '外语') return !DIALECTS.includes(v.lang) && v.lang !== '普通话';
  return v.tags.includes(state.filter);
}
function matchSearch(v) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return (v.zh + v.id + v.desc + v.lang + v.tags.join('')).toLowerCase().includes(q);
}

function renderChips() {
  const counts = {};
  for (const v of state.voices) for (const t of v.tags) counts[t] = (counts[t] || 0) + 1;
  const tags = Object.keys(counts).filter((t) => t !== '方言' && t !== '外语' && counts[t] >= 2)
    .sort((a, b) => counts[b] - counts[a]);
  const chips = ['全部', '女声', '男声', '方言', '外语', ...tags];
  const box = $('#chips');
  box.innerHTML = '';
  for (const c of chips) {
    const el = document.createElement('span');
    el.className = 'chip' + (state.filter === c ? ' on' : '');
    el.textContent = c;
    el.onclick = () => { state.filter = c; renderChips(); renderGrid(); };
    box.appendChild(el);
  }
}

function renderGrid() {
  const grid = $('#grid');
  const list = state.voices.filter((v) => matchFilter(v) && matchSearch(v));
  grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div class="empty">没有匹配的音色</div>'; return; }
  for (const v of list) {
    grid.appendChild(makeCard(v));
  }
}

function makeCard(v) {
  const card = document.createElement('div');
  card.className = 'card' + (v.id === state.current ? ' current' : '');
  card.dataset.voice = v.id;
  const head = document.createElement('div'); head.className = 'head';
  head.innerHTML = `<span class="zh">${v.zh}</span><span class="id">${v.id}</span>` +
    (v.id === state.current ? '<span class="use-badge">使用中</span>' : '');
  const desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = v.desc;
  const meta = document.createElement('div'); meta.className = 'meta';
  for (const m of metaChips(v)) {
    const s = document.createElement('span');
    s.className = 'tag ' + (m === v.gender ? (v.gender === '女' ? 'f' : 'm') : tagClass(v));
    s.textContent = m;
    meta.appendChild(s);
  }
  const btns = document.createElement('div'); btns.className = 'btns';
  const play = document.createElement('button'); play.textContent = '▶ 试听';
  play.onclick = () => preview(v, play);
  const use = document.createElement('button'); use.className = 'primary'; use.textContent = '使用';
  if (v.id === state.current) use.disabled = true;
  use.onclick = () => applyVoice(v, use);
  btns.append(play, use);
  card.append(head, desc, meta, btns);
  return card;
}

/** 静默刷新用：只更新"使用中"高亮，绝不重建 DOM（重建会让点了一半的按钮凭空消失）。 */
function updateCurrent() {
  for (const card of $('#grid').children) {
    const v = state.voices.find((x) => x.id === card.dataset.voice);
    if (!v) continue;
    const isCur = v.id === state.current;
    card.classList.toggle('current', isCur);
    const badge = card.querySelector('.use-badge');
    const useBtn = card.querySelectorAll('.btns button')[1];
    if (isCur && !badge) {
      card.querySelector('.head').insertAdjacentHTML('beforeend', '<span class="use-badge">使用中</span>');
    } else if (!isCur && badge) {
      badge.remove();
    }
    if (useBtn) useBtn.disabled = isCur;
  }
}

function setBusy(btn, busy, label) {
  btn.disabled = busy;
  btn.innerHTML = busy ? '<span class="spin"></span> ' + label : label;
}

async function preview(v, btn) {
  setBusy(btn, true, '合成中');
  try {
    const r = await fetch('/api/preview', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ voice: v.id, text: $('#previewText').value.trim() || undefined }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + r.status));
    }
    const blob = await r.blob();
    await new Audio(URL.createObjectURL(blob)).play();
  } catch (e) {
    toast('试听失败：' + e.message, 'err');
  } finally { setBusy(btn, false, '▶ 试听'); }
}

async function applyVoice(v, btn) {
  setBusy(btn, true, '切换中');
  try {
    const r = await fetch('/api/apply', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ voice: v.id }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    state.current = v.id;
    toast(`已切换到「${v.zh}」，鲸鱼正在用新声音打招呼～`, 'ok');
    updateCurrent();
  } catch (e) {
    toast('切换失败：' + e.message, 'err');
  } finally { setBusy(btn, false, '使用'); }
}

async function refresh(silent = false) {
  try {
    const r = await fetch('/api/voices');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'HTTP ' + r.status);
    const first = !state.voices.length;
    state.voices = j.voices; state.current = j.current;
    state.petOnline = j.petOnline; state.hasKey = j.hasKey;
    $('#count').textContent = j.count;
    $('#current').textContent = j.current || '未知';
    $('#currentId').textContent = j.current ? `（${j.current}）` : '';
    const dot = $('#petDot');
    dot.className = 'dot' + (j.petOnline ? ' on' : '');
    $('#petText').textContent = j.petOnline
      ? `小鲸鱼在线${j.hasKey ? '' : '（⚠ 没配 API Key，试听不可用）'}`
      : '小鲸鱼离线（试听可用，切换要先启动 DSH）';
    if (first || !silent) { renderChips(); renderGrid(); } else { updateCurrent(); }
  } catch (e) {
    if (!silent) toast('读取音色失败：' + e.message, 'err');
  }
}

$('#search').addEventListener('input', (e) => { state.q = e.target.value.trim(); renderGrid(); });
$('#refreshBtn').onclick = () => refresh();

refresh();
setInterval(() => refresh(true), 15000);
</script>
</body>
</html>
